services:
  backend:
    build: ./backend
    container_name: kneexpert-backend
    ports:
      - "9000:9000"
    volumes:
      # Model weights & data stay on local disk, mounted in (not baked into image)
      - ./backend/xray/models:/app/xray/models
      - ./backend/mri/models:/app/mri/models
      - ./backend/data:/app/data
      # Vector index persists across container restarts so the corpus is not
      # re-embedded on every `docker compose up`.
      - ./backend/rag/index:/app/rag/index
    environment:
      # Generation runs outside this container. host.docker.internal reaches an
      # Ollama running on the host; point it at a GPU box's URL to use one instead.
      # Retrieval and the safety gate run in-process and need nothing here.
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-meditron3-8b}
      # Must be explicit: Ollama otherwise defaults to 2048 and silently
      # truncates the prompt from the left, dropping the safety rules first.
      - OLLAMA_NUM_CTX=${OLLAMA_NUM_CTX:-8192}
      - RAG_TAU=${RAG_TAU:-0.60}
      # Passed through only when set in the shell; otherwise the backend falls
      # back to RAG_TAU, so the two thresholds start out equal.
      - RAG_TAU_NEXT_STEPS
    extra_hosts:
      # Makes host.docker.internal resolve on Linux hosts, where it is not
      # provided automatically as it is on Docker Desktop.
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: kneexpert-frontend
    ports:
      - "8080:8080"
    environment:
      # Browser-side calls hit the host-mapped backend port
      - VITE_BACKBONE_URL=http://localhost:9000
    depends_on:
      - backend
    restart: unless-stopped
